# Reverse proxy for Khmer Moon Calendar (production compose).
# TLS is expected to terminate here or at an upstream load balancer; see docs/deployment/production.md.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  keepalive_timeout 30s;

  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                              '"duration":$request_time,"request_id":"$request_id"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Public API rate limit: 10 req/s per client with short bursts.
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_status 429;

  upstream frontend { server frontend:3000; }
  upstream backend  { server backend:8087; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      limit_except GET HEAD OPTIONS { deny all; }
      proxy_pass http://backend;
    }

    location /_next/static/ {
      proxy_pass http://frontend;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://frontend;
    }
  }
}
